name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/build_and_test.yml"
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/build_and_test.yml"

permissions:
  contents: read

jobs:
  macOS:
    name: macOS package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  iOS:
    name: iOS simulator tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme WhatsNewKit \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO
